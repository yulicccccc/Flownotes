<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowNotes - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <svg class="wavy-logo" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 15 Q20 5 30 15 T50 15 T70 15 T90 15" stroke="#c19b6c" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M10 25 Q20 15 30 25 T50 25 T70 25 T90 25" stroke="#c19b6c" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M10 35 Q20 25 30 35 T50 35 T70 35 T90 35" stroke="#c19b6c" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>
            <h1 class="logo-text">FLOW NOTE</h1>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <div class="card-header">
                <h2>AUTHENTICATION</h2>
                <div class="divider-line"></div>
            </div>

            <!-- Notice / Status Banner -->
            <div id="alertBox" class="alert-box" style="display:none; margin-bottom: 20px; padding: 12px; border-radius: 4px; font-size: 12px; text-align: center; font-weight: 600;"></div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label>EMAIL ADDRESS (ADMIN)</label>
                    <div class="input-wrapper email-wrapper">
                        <span class="icon">✉️</span>
                        <input type="email" id="email" value="qchen9108@gmail.com" placeholder="qchen9108@gmail.com">
                    </div>
                </div>

                <div class="input-group">
                    <label>PASSWORD (ADMIN)</label>
                    <div class="input-wrapper password-wrapper">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" value="Xy910817" placeholder="••••••••">
                        <span class="icon-right" id="togglePassword">👁️</span>
                    </div>
                </div>

                <button type="submit" id="btnLoginNow" class="btn-primary">
                    LOGIN NOW <span class="arrow">→</span>
                </button>

                <div class="auth-links">
                    <span class="muted">Role: <a href="#" id="linkRegister" class="gold-link">Super Admin</a></span>
                    <a href="#" id="linkForgot" class="muted" title="管理员特权模式已激活">Key: Xy910817</a>
                </div>
            </form>

            <div class="social-divider">
                <span>SOCIAL AUTHENTICATION</span>
            </div>

            <button type="button" id="btnGoogleLogin" class="btn-social">
                <span class="google-icon">G</span> LOGIN WITH GOOGLE (ADMIN)
            </button>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.style.opacity = type === 'text' ? '1' : '0.5';
            });
        }

        // Core Login Execution Function (Foolproof Admin Login)
        function executeLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');

            // Show admin success message
            if (alertBox) {
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                alertBox.style.border = '1px solid #10b981';
                alertBox.style.color = '#34d399';
                alertBox.innerHTML = '🎉 管理员认证成功！正在进入 FlowNotes 工作台...';
            }

            try {
                localStorage.setItem('flownotes_auth', 'true');
                localStorage.setItem('flownotes_user_email', email || 'qchen9108@gmail.com');
                localStorage.setItem('flownotes_user_role', 'admin');
                if (!localStorage.getItem('flownotes_active_map_id')) {
                    localStorage.setItem('flownotes_active_map_id', 'map_default');
                }
            } catch (e) {
                console.warn('localStorage error:', e);
            }

            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            }, 500);
        }

        // Event Listeners for all login actions
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                executeLogin();
            });
        }

        const btnGoogleLogin = document.getElementById('btnGoogleLogin');
        if (btnGoogleLogin) {
            btnGoogleLogin.addEventListener('click', () => {
                executeLogin();
            });
        }

        const linkRegister = document.getElementById('linkRegister');
        if (linkRegister) {
            linkRegister.addEventListener('click', (e) => {
                e.preventDefault();
                executeLogin();
            });
        }

        // If already authenticated, redirect immediately
        try {
            if (localStorage.getItem('flownotes_auth') === 'true') {
                window.location.href = 'index.html';
            }
        } catch (e) {}
    </script>
</body>
</html>
